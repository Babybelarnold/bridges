<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bridges</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Bridges.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Lets a Blazor component observe window orientation changes (e.g. phone rotation).
        // The component registers a .NET callback that receives true when the window is portrait.
        window.bridgesOrientation = {
            register: function (dotNetRef) {
                const report = function () {
                    const portrait = window.innerHeight > window.innerWidth * 1.1;
                    dotNetRef.invokeMethodAsync('OnOrientationChanged', portrait);
                };
                window.addEventListener('resize', report);
                window.addEventListener('orientationchange', report);
                report(); // report the initial state immediately
            }
        };
    </script>
</body>

</html>
